[workspace]
resolver = "2"
members = [
    "crates/proxy-core",
    "crates/proxy-daemon",
    "crates/proxy-cli",
    "crates/proxy-test",
    "crates/proxy-tun-test",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
reqwest = { version = "0.13", features = ["socks"] }
toml = "1.1"
url = "2"
rand = "0.10"
libc = "0.2"
sha2 = "0.11"
# Connector architecture: protocols implement a trait and register themselves.
async-trait = "0.1"
# TLS for HTTPS proxies and for the newer protocols.
rustls = "0.23"
tokio-rustls = "0.26"
webpki-roots = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

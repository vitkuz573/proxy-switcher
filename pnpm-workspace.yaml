packages:
  - "api"
  - "sdk"
  - "web"
  - "cli"

# pnpm >=11 replaced onlyBuiltDependencies with allowBuilds. These two packages
# need lifecycle scripts: better-sqlite3 builds/downloads its native binding,
# esbuild ships a platform binary.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
  # Next.js watches the filesystem through these two; both ship a prebuilt
  # binary that has to be unpacked by a lifecycle script.
  "@parcel/watcher": true
  "@swc/core": true
[package]
name = "proxy-daemon"
version = "0.1.0"
edition = "2021"
description = "Background daemon — TUN device, REST API, embedded Web UI"

[dependencies]
proxy-core = { path = "../proxy-core" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
axum.workspace = true
toml.workspace = true

# Time
chrono = { version = "0.4", features = ["serde"] }

# Static file serving
tower-http = { version = "0.7", features = ["fs", "cors"] }

# Stable ids derived from URLs
sha2.workspace = true

# The country database is fetched over HTTP.
reqwest = { version = "0.13", features = ["rustls"], default-features = false }

# Async
tokio-util = "0.7"

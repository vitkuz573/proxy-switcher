[package]
name = "proxy-core"
version = "0.1.0"
edition = "2021"
description = "Core library for proxy management — TUN I/O, forwarding, scraping, health checks"

[dependencies]
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
reqwest.workspace = true
url.workspace = true

# TUN device
tun = "0.8"

# SOCKS
tokio-socks = "0.5"

# DNS
hickory-resolver = "0.26"

# HTML parsing
scraper = "0.27"

# Async
tokio-stream = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }
rand.workspace = true

# Database
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }

# Socket options
libc.workspace = true

# Stable ids derived from URLs
sha2.workspace = true

# The connector architecture
async-trait.workspace = true

# TLS, for HTTPS proxies and the newer protocols
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true


[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3"

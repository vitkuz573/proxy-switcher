# Scrape sources
#
# The engine reads this file at start-up, so a source is added by editing it
# and restarting, or through the API at run time — which is remembered across
# restarts. Nothing here is compiled into the binary: the list of where to
# look for proxies is configuration, and it changes far more often than the
# code does.
#
# Each entry may name the protocol the list is about. The name is only a hint:
# a list that says the protocol of every entry is trusted over the hint, and a
# list that says nothing is read as the hint says. The format is detected from
# the body, so a source needs no format either.
#
# A source that is blocked, slow or broken costs one failed request. The rest
# of the list is scraped anyway, and the engine keeps the proxies it already
# has.


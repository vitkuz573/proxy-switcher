[daemon]
api_host = "0.0.0.0"
api_port = 9090
data_dir = "/var/lib/proxy-switcher"

[tun]
name = "ps-tun0"
address = "10.0.0.1"
mtu = 1500
disable_ipv6 = true
# Point the default route at the TUN device. Off by default: it changes how
# the whole host reaches the internet, and the routing policy decides which
# traffic a proxy applies to.
default_route = false
# Firewall mark for the daemon's own traffic, so it bypasses the TUN. Without
# it the daemon's own connections — to the proxies it tests, to the sources it
# scrapes — would be captured by the device it created.
bypass_mark = 0x5053

[scraper]
enabled = true
interval_secs = 300
sources = []

[geo]
# Where the proxies are.
#
# The engine knows the address every verified proxy exits from, so the country
# is worked out from that rather than taken from the list: the lists name a
# country in words, often the wrong words, and name none at all for most of
# their entries.
enabled = true
# The country database on disk. It is fetched when it is missing or stale.
database = "/var/lib/proxy-switcher/geo-country.csv"
# Where the database comes from.
update_url = "https://raw.githubusercontent.com/sapics/ip-location-db/main/geolite2-country/geolite2-country-ipv4.csv"
# How often the database is refreshed.
update_interval_secs = 86400
# How long the fetch may take.
download_timeout_secs = 180

[health]
# The batch is I/O bound, so this is the main throughput lever.
concurrency = 1000
# Budget for the proxy handshake. A proxy that will not complete a handshake
# is dead, and dead proxies are the majority of the pool, so the batch spent
# most of its time waiting out the full timeout on endpoints that never
# answer.
connect_timeout_secs = 3
# Budget for the request and response exchange.
timeout_secs = 5
# How often a proxy known to work is re-checked.
check_interval_secs = 600
# Wait after each consecutive failure. The last entry applies to every further
# failure, so a long-dead proxy is looked at a few times a day.
failed_backoff_secs = [60, 300, 900, 3600, 10800, 21600]
# An inconclusive probe proves nothing, so it is retried sooner than a failure.
inconclusive_backoff_secs = 300
# Address echo services, tried in order. The probe needs the address the target
# sees: that is the proof the request travelled through the proxy, and it is
# also the address the traffic will leave from. An endpoint that merely answers
# HTTP is not a proxy.
#
# More than one target, because a target is a third party: it can be blocked,
# overloaded or down, and in some networks most of them are unreachable. The
# engine verifies a target directly before using it, so an unreachable target
# pauses the checks instead of marking the whole pool dead.
target_urls = [
    # Reports the address the request came from, in a single line.
    #
    # The order matters for the check the engine makes of itself: the first
    # target that answers directly is the one whose answer says what the
    # engine's own address is. A target the engine cannot reach may still
    # answer through a proxy, which sits on another network — so every target
    # is tried before a proxy is given up on.
    "http://l2.io/ip",
    "http://ifconfig.co/ip",
    # Reports both the source address and the request headers, which is what
    # says whether the proxy leaked the client's address.
    "http://httpbin.org/anything",
    # Faster fallbacks that report only the address.
    "http://icanhazip.com",
    "http://api.ipify.org",
    "http://ifconfig.me/ip",
]

max_consecutive_failures = 3
# How long a proxy that has never worked is kept before it leaves the pool.
unverified_ttl_secs = 3600

[pool]
# Hard ceiling on the pool size. The least useful proxies are dropped first.
max_proxies = 300000
min_score = 0.0

[routing]
# Which traffic a proxy applies to.
#
# The device is not the default route: only the destinations named here are
# sent into it, and everything else — including the daemon's own traffic —
# keeps the route it had. A proxy that carries one destination is a tool; a
# proxy that carries everything is a single point of failure for the host.
#
#   none       nothing goes through a proxy
#   allowlist  only what matches the rules below
#   denylist   everything except what matches the rules below
mode = "none"
# Address ranges, as "1.2.3.0/24" or a bare "1.2.3.4".
cidrs = []
# Hostnames or domain suffixes, as "example.com" or ".example.com".
# A name is resolved and the addresses behind it are routed.
#
# The mode has to be "allowlist" for these to matter. While the mode is
# "none" nothing is proxied, and the counters on the dashboard stay at zero —
# which is the truth: the device is carrying nothing.
domains = []
# Destination ports. Empty means every port.
ports = []
# Addresses that never go through a proxy, whatever the mode says. The proxy
# itself belongs here: a connection to the proxy routed through a proxy is a
# loop.
always_direct = []

[local_proxy]
# A local port that speaks the HTTP proxy protocol.
#
# A program is pointed at it and never has to know which public proxy is
# carrying its traffic. The credential it authenticates with decides how the
# traffic is carried: a sticky session, a rotation by time, or a new proxy
# for every request.
#
# It is off by default. A port that proxies whatever is asked of it is an
# open door, and the operator is the one who decides to open it.
enabled = false
host = "127.0.0.1"
port = 9098
# Whether a client without a credential is let in. The credential is what
# carries the policy, so without one there is nothing that says how the
# traffic should be carried.
allow_anonymous = false
# How many proxies are tried before the client is refused.
max_attempts = 5
# The budget for opening one tunnel, in seconds.
timeout_secs = 10
